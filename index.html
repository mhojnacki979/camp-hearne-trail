<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camp Hearne — Self-Guided Trail Map</title>
<meta name="description" content="Interactive self-guided walking trail of the Camp Hearne WWII Historic Site — 22 stops across the original camp footprint.">
<meta name="theme-color" content="#0E2536">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Camp Hearne">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<style>
  :root{
    --navy:#0E2536; --navy-2:#143247; --panel:#16344B;
    --line:rgba(139,183,197,.28); --ink:#E7EEF0; --ink-dim:#9FB6C0;
    --brass:#CB9A46; --brass-hi:#DDAE58; --survey:#C1503C; --start:#5B9E63;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --serif:"Palatino Linotype",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--navy);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;}
  a{color:var(--brass-hi);}
  img{max-width:100%;display:block;}
  .layout{display:grid;grid-template-columns:400px 1fr;height:100vh;height:100dvh;}

  /* ---------- panel ---------- */
  .panel{position:relative;background:var(--navy);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
  .p-head{padding:calc(22px + env(safe-area-inset-top)) calc(22px + env(safe-area-inset-right)) 16px calc(22px + env(safe-area-inset-left));border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:1rem;}
  .brand .rule{color:var(--brass);}
  .brand small{font-weight:400;letter-spacing:.14em;font-size:.62rem;color:var(--ink-dim);}
  h1{font-family:var(--serif);font-weight:400;font-size:1.5rem;line-height:1.15;margin:12px 0 0;}
  .p-head p{color:var(--ink-dim);font-size:.86rem;margin:6px 0 0;}
  .tools{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .tool{flex:1;min-width:120px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    text-decoration:none;text-align:center;padding:10px 12px;font-weight:600;letter-spacing:.03em;font-size:.74rem;
    border:1.5px solid var(--line);color:var(--ink);border-radius:3px;cursor:pointer;background:var(--navy-2);transition:.15s;}
  .tool:hover{border-color:var(--brass);color:var(--brass);}
  .tool.brass{background:var(--brass);color:var(--navy);border-color:var(--brass);}
  .tool.brass:hover{background:var(--brass-hi);color:var(--navy);}
  .tool svg{width:15px;height:15px;}

  .list{overflow-y:auto;padding:10px 14px calc(30px + env(safe-area-inset-bottom));min-height:0;flex:1;-webkit-overflow-scrolling:touch;}
  .grp{font-family:var(--serif);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);
    padding:14px 6px 6px;border-bottom:1px solid var(--line);margin-bottom:6px;}
  .row{display:flex;gap:11px;align-items:center;padding:9px 8px;border-radius:4px;cursor:pointer;transition:.12s;}
  .row:hover,.row:focus{background:var(--navy-2);outline:none;}
  .row .b{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--brass);color:var(--brass);
    display:grid;place-items:center;font-weight:700;font-size:.8rem;}
  .row.start .b{border-color:var(--start);color:var(--start);}
  .row.finish .b{border-color:var(--survey);color:var(--survey);}
  .row>span:last-child{display:flex;flex-direction:column;min-width:0;}
  .row .nm{display:block;font-size:.95rem;font-weight:500;}
  .row .sc{display:block;font-size:.74rem;color:var(--ink-dim);margin-top:1px;}

  /* ---------- detail drawer ---------- */
  .detail{position:absolute;inset:0;background:var(--navy);z-index:20;display:flex;flex-direction:column;
    transform:translateX(-102%);transition:transform .32s cubic-bezier(.4,0,.2,1);min-height:0;}
  .detail.open{transform:none;}
  .d-top{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex:none;}
  .back{background:none;border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:7px 12px;font-size:.78rem;
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;}
  .back:hover{border-color:var(--brass);color:var(--brass);}
  .d-top .badge{width:30px;height:30px;border-radius:50%;border:2px solid var(--brass);color:var(--brass);
    display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:none;}
  .d-body{overflow-y:auto;padding:0 0 calc(40px + env(safe-area-inset-bottom));min-height:0;-webkit-overflow-scrolling:touch;}
  .d-photo{display:block;width:100%;height:auto;max-height:76vh;object-fit:contain;background:#0d1f2d;border-bottom:1px solid var(--line);}
  .d-photo-cap{font-size:.7rem;color:var(--ink-dim);padding:6px 20px 0;font-style:italic;}
  .d-audio{margin:16px 0 2px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
    background:rgba(242,193,78,.06);}
  .d-audio-h{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);margin-bottom:8px;}
  .d-audio audio{width:100%;display:block;height:36px;}
  .d-inner{padding:18px 22px 0;}
  .d-inner h2{font-family:var(--serif);font-weight:400;font-size:1.55rem;line-height:1.15;margin:0;}
  .d-sector{color:var(--brass);font-size:.78rem;letter-spacing:.06em;margin-top:6px;text-transform:uppercase;}
  .d-inner h4{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brass-hi);margin:20px 0 2px;}
  .d-inner p{font-size:.98rem;line-height:1.62;color:#dce7ea;margin:9px 0;}
  .d-more{display:inline-block;margin:18px 0 0;font-weight:600;font-size:.82rem;letter-spacing:.04em;text-decoration:none;
    color:var(--brass);border-bottom:1px solid var(--brass);padding-bottom:2px;}


  /* ---------- safety ---------- */
  .safety-row{display:flex;gap:11px;align-items:center;padding:11px 12px;margin:2px 0 12px;border-radius:4px;
    cursor:pointer;background:rgba(193,80,60,.13);border:1px solid rgba(193,80,60,.55);transition:.12s;}
  .safety-row:hover,.safety-row:focus{background:rgba(193,80,60,.22);outline:none;}
  .safety-row .ic{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--survey);
    color:var(--survey);display:grid;place-items:center;font-weight:700;font-size:.95rem;}
  .safety-row .nm{display:block;font-size:.95rem;font-weight:600;color:#f3cfc8;}
  .safety-row .sc{display:block;font-size:.74rem;color:var(--ink-dim);margin-top:1px;}
  .d-inner h3.sf{font-family:var(--sans);font-size:.95rem;font-weight:700;color:#f3cfc8;margin:18px 0 2px;}
  .sf-rule{background:rgba(193,80,60,.14);border:1px solid rgba(193,80,60,.5);border-radius:4px;
    padding:12px 14px;margin:14px 0 4px;font-weight:600;color:#f3cfc8;}
  .sf-list{margin:6px 0 0;padding-left:18px;color:#dce7ea;font-size:.95rem;line-height:1.6;}
  .notice-wrap{position:fixed;inset:0;z-index:3000;background:rgba(6,14,20,.74);display:grid;place-items:center;padding:20px;}
  .notice{max-width:440px;width:100%;background:var(--navy);border:1px solid var(--line);border-radius:5px;
    padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.6);}
  .notice h3{font-family:var(--serif);font-weight:400;font-size:1.4rem;margin:0;}
  .notice p{color:#cfe0e6;font-size:.92rem;line-height:1.55;margin:10px 0 0;}
  .notice ul{margin:10px 0 0;padding-left:18px;color:#cfe0e6;font-size:.9rem;line-height:1.6;}
  .notice .btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .notice .btns button{flex:1;min-width:130px;padding:11px 14px;border-radius:3px;font-weight:600;
    font-size:.8rem;cursor:pointer;border:1.5px solid var(--line);background:var(--navy-2);color:var(--ink);}
  .notice .btns .go{background:var(--brass);color:var(--navy);border-color:var(--brass);}
  .ack{margin:22px 0 0;padding:14px 16px;border-top:1px solid var(--line);
    background:rgba(139,183,197,.06);border-radius:4px;}
  .ack h4{margin:0 0 6px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brass-hi);}
  .ack p{font-size:.86rem;line-height:1.6;color:var(--ink-dim);margin:6px 0 0;}
  .ack em{color:#cfe0e6;font-style:italic;}


  /* ---------- map ---------- */
  #map{height:100vh;height:100dvh;background:var(--panel);z-index:1;}
  .marker-pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    background:var(--navy);border:2.5px solid var(--brass);box-shadow:0 2px 6px rgba(0,0,0,.5);
    display:grid;place-items:center;}
  .marker-pin span{transform:rotate(45deg);color:var(--brass);font-weight:700;font-size:.82rem;font-family:var(--sans);}
  .marker-pin.start{border-color:var(--start);} .marker-pin.start span{color:var(--start);}
  .marker-pin.finish{border-color:var(--survey);} .marker-pin.finish span{color:var(--survey);}
  .leaflet-tooltip.tip{background:var(--navy);color:var(--ink);border:1px solid var(--brass);border-radius:3px;
    box-shadow:0 3px 10px rgba(0,0,0,.5);font-family:var(--sans);padding:7px 11px;}
  .leaflet-tooltip.tip b{color:var(--brass-hi);display:block;font-size:.9rem;}
  .leaflet-tooltip.tip span{color:var(--ink-dim);font-size:.76rem;}
  .leaflet-tooltip.tip:before{display:none;}
  .leaflet-bar a{background:var(--navy-2);color:var(--ink);border-bottom-color:var(--line);}
  .leaflet-bar a:hover{background:var(--panel);}
  .me-dot{width:16px;height:16px;border-radius:50%;background:#2E8BE6;border:3px solid #fff;box-shadow:0 0 0 2px rgba(46,139,230,.4);}

  .mobile-open{position:absolute;left:0;right:0;bottom:0;z-index:15;display:none;}

  /* ---------- responsive ---------- */
  @media(max-width:820px){
    body{overflow:auto;}
    .layout{grid-template-columns:1fr;height:auto;min-height:100dvh;}
    #map{height:56vh;height:56dvh;order:1;}
    .panel{order:2;max-height:none;}
    .list{max-height:44vh;}
    .detail{position:fixed;inset:0;z-index:2000;}
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="panel">
    <div class="p-head">
      <div class="brand">Camp Hearne <span class="rule">/</span> <small>HISTORIC TRAILS</small></div>
      <h1>Self-guided walking trail</h1>
      <p>22 stops across the original camp footprint · about 1.3 miles. Tap a marker or a stop to read its story.</p>
      <div class="tools">
        <button class="tool brass" id="locateBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>
          Locate me
        </button>
        <a class="tool" id="dirBtn" href="https://maps.google.com/?q=12424+Camp+Hearne+Road+Hearne+TX+77859" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
          Directions
        </a>
      </div>
    </div>
    <div class="list" id="list"></div>

    <div class="detail" id="detail" aria-hidden="true">
      <div class="d-top">
        <button class="back" id="backBtn" type="button">&larr; All stops</button>
        <div class="badge" id="dBadge">A</div>
      </div>
      <div class="d-body" id="dBody"></div>
    </div>
  </aside>
  <div id="map"></div>
</div>

<script src="safety-data.js?v=2"></script>
<script src="stops-data.js?v=13"></script>
<script src="assets/vendor/leaflet/leaflet.js"></script>
<script>
(function(){
  var STOPS = window.STOPS || [];
  var TRAIL = window.TRAIL || [];
  var HEADERS = (window.SECTION_HEADERS || []).map(function(h){return h.toLowerCase();});
  var START_ID="E", FINISH_ID="V";

  var map = L.map('map',{zoomControl:true,scrollWheelZoom:true}).setView([30.8855,-96.6178],16);
  var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:20,maxNativeZoom:19,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'}).addTo(map);
  var streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:20,maxNativeZoom:19,attribution:'© OpenStreetMap contributors'});
  // secondary trail network, surveyed. Own pane below overlayPane so that toggling
  // it on can never draw it over the primary trail or the stop markers.
  map.createPane('network');
  map.getPane('network').style.zIndex = 390;
  var networkLayer = L.layerGroup();
  (window.TRAIL_NETWORK || []).forEach(function(seg){
    L.polyline(seg.pts,{pane:'network',color:'#0E2536',weight:5,opacity:.35,lineJoin:'round'}).addTo(networkLayer);
    L.polyline(seg.pts,{pane:'network',color:'#9FB3C8',weight:2.5,opacity:.9,dashArray:'6,5',lineJoin:'round'})
      .bindTooltip(seg.name,{sticky:true,direction:'top'}).addTo(networkLayer);
  });

  L.control.layers({'Satellite':sat,'Street map':streets},
    {'All trails':networkLayer},{position:'topright'}).addTo(map);

  // primary trail, from Cathy's survey
  L.polyline(TRAIL,{color:'#0E2536',weight:7,opacity:.55,lineJoin:'round'}).addTo(map);   // dark casing
  L.polyline(TRAIL,{color:'#F2C14E',weight:4,opacity:.95,lineJoin:'round'}).addTo(map);   // gold line

  function cls(id){ return id===START_ID?' start':(id===FINISH_ID?' finish':''); }

  var markers={};
  STOPS.forEach(function(s){
    if(s.lat==null||s.lng==null) return;
    var icon=L.divIcon({className:'',html:'<div class="marker-pin'+cls(s.id)+'"><span>'+s.id+'</span></div>',
      iconSize:[30,30],iconAnchor:[15,29],tooltipAnchor:[0,-26]});
    var m=L.marker([s.lat,s.lng],{icon:icon}).addTo(map);
    m.bindTooltip('<b>'+s.id+' · '+esc(s.name)+'</b><span>'+esc(s.sector)+'</span>',
      {className:'tip',direction:'top',opacity:1});
    m.on('click',function(){ openDetail(s.id); });
    markers[s.id]=m;
  });

  var pts=STOPS.filter(function(s){return s.lat!=null;}).map(function(s){return [s.lat,s.lng];});
  var bounds=L.latLngBounds(pts).pad(0.12);
  function fit(){ map.invalidateSize(); var s=map.getSize(); if(s.x>60&&s.y>60){ map.fitBounds(bounds); } }
  map.whenReady(fit); setTimeout(fit,300); setTimeout(fit,900); window.addEventListener('load',fit);

  // ---- side list ----
  function esc(t){ return (t||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var list=document.getElementById('list');
  var grp=document.createElement('div'); grp.className='grp'; grp.textContent='The stops · A–V';
  list.appendChild(grp);
  STOPS.forEach(function(s){
    var r=document.createElement('div');
    r.className='row'+(s.id===START_ID?' start':(s.id===FINISH_ID?' finish':''));
    r.tabIndex=0;
    r.innerHTML='<span class="b">'+s.id+'</span><span><span class="nm">'+esc(s.name)+'</span>'+
      '<span class="sc">'+esc(s.sector)+'</span></span>';
    r.addEventListener('click',function(){ openDetail(s.id,true); });
    r.addEventListener('keydown',function(e){ if(e.key==='Enter'){openDetail(s.id,true);} });
    list.appendChild(r);
  });

  // ---- detail drawer ----
  var detail=document.getElementById('detail'), dBody=document.getElementById('dBody'), dBadge=document.getElementById('dBadge');
  function renderNarr(paras){
    return paras.map(function(p){
      var key=p.trim().toLowerCase().replace(/[:.]$/,'');
      if(HEADERS.indexOf(key)>=0) return '<h4>'+esc(p)+'</h4>';
      return '<p>'+esc(p)+'</p>';
    }).join('');
  }
  function openDetail(id,fly){
    var s=STOPS.filter(function(x){return x.id===id;})[0]; if(!s) return;
    dBadge.textContent=s.id;
    dBadge.style.borderColor=s.id===START_ID?'var(--start)':(s.id===FINISH_ID?'var(--survey)':'var(--brass)');
    dBadge.style.color=dBadge.style.borderColor;
    var html='';
    if(s.photo) html+='<img class="d-photo" src="'+s.photo+'" alt="'+esc(s.name)+'" loading="lazy"><div class="d-photo-cap">Historic photograph · Camp Hearne collection</div>';
    html+='<div class="d-inner"><h2>'+esc(s.name)+'</h2><div class="d-sector">'+esc(s.sector)+'</div>';
    if(s.audio) html+='<div class="d-audio"><div class="d-audio-h">Listen to this stop</div>'+
      '<audio controls preload="metadata" src="'+esc(s.audio)+'"></audio></div>';
    html+=renderNarr(s.narrative||[]);
    html+='<a class="d-more" href="'+esc(s.link)+'" target="_blank" rel="noopener">Read more at camphearne.com &rarr;</a>';
    if(s.id==='V') html+=ackHTML();
    html+='</div>';
    dBody.innerHTML=html; dBody.scrollTop=0;
    detail.classList.add('open'); detail.setAttribute('aria-hidden','false');
    var mk=markers[id];
    if(mk){ if(fly!==false) map.flyTo([s.lat,s.lng],19,{duration:.7}); mk.openTooltip(); }
  }
  function closeDetail(){ detail.classList.remove('open'); detail.setAttribute('aria-hidden','true'); }
  document.getElementById('backBtn').addEventListener('click',closeDetail);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeDetail(); });


  // ---- safety ----
  var SF=window.SAFETY;
  function openSafety(){
    dBadge.textContent='!'; dBadge.style.borderColor='var(--survey)'; dBadge.style.color='var(--survey)';
    var h='<div class="d-inner"><h2>'+esc(SF.title)+'</h2>'+
          '<div class="d-sector">Safety &amp; trail rules</div>'+
          '<p>'+esc(SF.lede)+'</p>'+
          '<div class="sf-rule">'+esc(SF.rule)+'</div>';
    SF.items.forEach(function(i){ h+='<h3 class="sf">'+esc(i.t)+'</h3><p>'+esc(i.b)+'</p>'; });
    h+='<h4>Please do</h4><ul class="sf-list">'+SF.dos.map(function(d){return '<li>'+esc(d)+'</li>';}).join('')+'</ul>';
    h+='<h4>Please don\'t</h4><ul class="sf-list">'+SF.donts.map(function(d){return '<li>'+esc(d)+'</li>';}).join('')+'</ul>';
    h+='</div>';
    dBody.innerHTML=h; dBody.scrollTop=0;
    detail.classList.add('open'); detail.setAttribute('aria-hidden','false');
  }
  (function(){
    var r=document.createElement('div'); r.className='safety-row'; r.tabIndex=0;
    r.innerHTML='<span class="ic">!</span><span><span class="nm">Before you go — safety &amp; trail rules</span>'+
                '<span class="sc">Stay on the trails · take water</span></span>';
    r.addEventListener('click',openSafety);
    r.addEventListener('keydown',function(e){ if(e.key==='Enter'){openSafety();} });
    list.insertBefore(r, list.firstChild);
  })();
  // first-visit notice
  (function(){
    try{ if(localStorage.getItem('ch_safety_ack')==='1') return; }catch(e){}
    var w=document.createElement('div'); w.className='notice-wrap';
    w.innerHTML='<div class="notice" role="dialog" aria-modal="true"><h3>'+esc(SF.title)+'</h3>'+
      '<p>'+esc(SF.lede)+'</p><ul><li>Stay on the marked trails — off-trail is poison ivy, ticks and snakes.</li>'+
      '<li>Take water. Summer here is hot and humid.</li>'+
      '<li>Trails can stay muddy for days after rain.</li></ul>'+
      '<div class="btns"><button type="button" id="nOk">Got it</button>'+
      '<button type="button" class="go" id="nMore">Read full safety info</button></div></div>';
    document.body.appendChild(w);
    function close(){ try{localStorage.setItem('ch_safety_ack','1');}catch(e){} w.remove(); }
    w.querySelector('#nOk').addEventListener('click',close);
    w.querySelector('#nMore').addEventListener('click',function(){ close(); openSafety(); });
  })();
  // ---- credits / acknowledgement ----
  var CR=window.CREDITS;
  function ackHTML(){
    return '<div class="ack"><h4>'+CR.title+'</h4>'+
           CR.body.map(function(b){return '<p>'+b+'</p>';}).join('')+'</div>';
  }


  // ---- locate me (live tracking while you walk) ----
  var meMarker=null, meCircle=null, watchId=null;
  var ICON_LOC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg> ';
  var btn=document.getElementById('locateBtn');
  function stopWatch(){
    if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
    btn.innerHTML=ICON_LOC+'Locate me';
    btn.classList.add('brass');
  }
  function place(pos, recenter){
    var ll=[pos.coords.latitude,pos.coords.longitude], acc=pos.coords.accuracy;
    if(meMarker){ meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(acc); }
    else{
      meMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="me-dot"></div>',
        iconSize:[16,16],iconAnchor:[8,8]}),zIndexOffset:1000}).addTo(map);
      meCircle=L.circle(ll,{radius:acc,color:'#2E8BE6',fillColor:'#2E8BE6',fillOpacity:.12,weight:1}).addTo(map);
    }
    if(recenter) map.setView(ll, Math.max(map.getZoom(),18));
  }
  btn.addEventListener('click',function(){
    if(!navigator.geolocation){ alert('Location is not available on this device.'); return; }
    if(watchId!==null){ stopWatch(); return; }            // tap again to stop
    btn.innerHTML=ICON_LOC+'Locating…';
    var first=true;
    watchId=navigator.geolocation.watchPosition(function(pos){
      place(pos, first); first=false;
      btn.innerHTML=ICON_LOC+'Tracking — tap to stop';
      btn.classList.remove('brass');
    },function(err){
      stopWatch();
      alert(err && err.code===1
        ? 'Location permission was denied. Enable location access for this site and try again.'
        : 'Could not get your location. Move to open sky and try again.');
    },{enableHighAccuracy:true,timeout:15000,maximumAge:5000});
  });
})();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
